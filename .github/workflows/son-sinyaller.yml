name: Son Sinyaller (Kar/Zarar)

on:
  workflow_dispatch:
    inputs:
      gun:
        description: "Kac gun geriye bakilsin"
        required: false
        default: "15"

permissions:
  contents: write

jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install yfinance pandas

      - name: Raporu uret
        # pipefail sart: tee'nin cikis kodu python'unkini gizlerdi,
        # hata sessizce basarili gorunurdu.
        shell: bash
        run: |
          set -o pipefail
          python son_sinyaller.py "${{ inputs.gun }}" 2>&1 | tee /tmp/cikti.log

      - name: Sonucu is ozetine yaz
        if: success()
        run: cat sonuclar/son_sinyaller.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: HATA — is ozetine yaz
        if: failure()
        run: |
          {
            echo "# ❌ RAPOR URETILEMEDI"
            echo ""
            if grep -q "endeks verisi alinamadi" /tmp/cikti.log 2>/dev/null; then
              echo "## Sebep: BIST100 endeks verisi alinamadi"
              echo ""
              echo "Goreli guc kriteri (son 21 gun getirisi > BIST100)"
              echo "hesaplanamadigi icin rapor uretilmedi. Kriteri sessizce"
              echo "atlayip yaniltici bir tablo vermemek icin duruldu."
              echo ""
              echo "En olasi sebep: Yahoo rate limit (429). Birkac dakika"
              echo "sonra tekrar calistirmak genelde yeterli."
            else
              echo "## Sebep: asagidaki log'a bakin"
            fi
            echo ""
            echo '```'
            tail -40 /tmp/cikti.log 2>/dev/null || echo "(log alinamadi)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sonucu commit et
        if: success()
        run: |
          git config user.name "bist-tarama-bot"
          git config user.email "actions@github.com"
          git add sonuclar/son_sinyaller.md
          git diff --cached --quiet || git commit -m "Son sinyaller raporu: $(date +'%Y-%m-%d %H:%M')"
          git push

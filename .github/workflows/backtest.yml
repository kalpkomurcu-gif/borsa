name: Filtre Karsilastirmali Backtest

on:
  workflow_dispatch:  # Sadece manuel: Actions sekmesi -> Run workflow

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install yfinance pandas

      - name: Backtesti calistir
        run: python backtest.py

      - name: Sonucu is ozetine yaz
        if: always()
        run: cat sonuclar/backtest.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Sonucu commit et
        run: |
          git config user.name "bist-tarama-bot"
          git config user.email "actions@github.com"
          git add sonuclar/backtest.md
          git diff --cached --quiet || git commit -m "Backtest sonucu: $(date +'%Y-%m-%d %H:%M')"
          git push
